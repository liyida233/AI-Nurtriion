services:
  mysql:
    image: mysql:8.4
    container_name: ai-nutrition-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_nutrition
      MYSQL_USER: ai_nutrition
      MYSQL_PASSWORD: ai_nutrition
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: ai-nutrition-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
