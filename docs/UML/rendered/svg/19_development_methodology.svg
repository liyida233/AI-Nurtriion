<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1019px" preserveAspectRatio="none" style="width:389px;height:1019px;background:#FFFFFF;" version="1.1" viewBox="0 0 389 1019" width="389px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="347.7373" x="20" y="36.0439">Iterative and Incremental Development Methodology</text></g><ellipse cx="196.3459" cy="65.1201" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F7F9FC" height="52.7773" rx="12.5" ry="12.5" style="stroke:#344054;stroke-width:0.5;" width="232.7422" x="79.9749" y="95.1201"/><text fill="#101828" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.7422" x="89.9749" y="118.8721">Review project brief, assessment rubric,</text><text fill="#101828" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="184.1016" x="89.9749" y="135.2607">literature, and supervisor feedback</text><rect fill="#F7F9FC" height="36.3887" rx="12.5" ry="12.5" style="stroke:#344054;stroke-width:0.5;" width="242.7793" x="74.9563" y="226.0034"/><text fill="#101828" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.7793" x="84.9563" y="249.7554">Define and prioritise module requirements</text><rect fill="#F7F9FC" height="52.7773" rx="12.5" ry="12.5" style="stroke:#344054;stroke-width:0.5;" width="218.7793" x="86.9563" y="282.3921"/><text fill="#101828" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.7793" x="96.9563" y="306.144">Design architecture, database model,</text><text fill="#101828" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.084" x="96.9563" y="322.5327">API contracts, and interface flows</text><rect fill="#F7F9FC" height="36.3887" rx="12.5" ry="12.5" style="stroke:#344054;stroke-width:0.5;" width="228.0898" x="82.301" y="355.1694"/><text fill="#101828" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.0898" x="92.301" y="378.9214">Implement a small functional increment</text><rect fill="#F7F9FC" height="36.3887" rx="12.5" ry="12.5" style="stroke:#344054;stroke-width:0.5;" width="240.1074" x="76.2922" y="411.5581"/><text fill="#101828" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.1074" x="86.2922" y="435.3101">Run unit, build, API, and workflow checks</text><rect fill="#F7F9FC" height="52.7773" rx="12.5" ry="12.5" style="stroke:#344054;stroke-width:0.5;" width="169.4082" x="111.6418" y="526.0527"/><text fill="#101828" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.4082" x="121.6418" y="549.8047">Revise requirement, design,</text><text fill="#101828" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="95.3789" x="121.6418" y="566.1934">or implementation</text><rect fill="#F7F9FC" height="36.3887" rx="12.5" ry="12.5" style="stroke:#344054;stroke-width:0.5;" width="221.4336" x="85.6292" y="602.3416"/><text fill="#101828" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.4336" x="95.6292" y="626.0935">Reimplement the functional increment</text><rect fill="#F7F9FC" height="36.3887" rx="12.5" ry="12.5" style="stroke:#344054;stroke-width:0.5;" width="206.0938" x="93.2991" y="658.7302"/><text fill="#101828" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.0938" x="103.2991" y="682.4822">Repeat relevant verification checks</text><polygon fill="#EAF2FF" points="94.5288,467.9468,298.1631,467.9468,310.1631,479.9468,298.1631,491.9468,94.5288,491.9468,82.5288,479.9468,94.5288,467.9468" style="stroke:#175CD3;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="14.0615" x="200.3459" y="504.5527">No</text><text fill="#101828" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="203.6343" x="94.5288" y="485.0413">Requirements and behaviour acceptable?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="18.9546" x="63.5742" y="477.5298">Yes</text><rect fill="#F7F9FC" height="52.7773" rx="12.5" ry="12.5" style="stroke:#344054;stroke-width:0.5;" width="166.0859" x="113.303" y="737.1189"/><text fill="#101828" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.0859" x="123.303" y="760.8708">Integrate increment into the</text><text fill="#101828" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="133.3652" x="123.303" y="777.2595">working full-stack system</text><polygon fill="#EAF2FF" points="121.7603,167.8975,270.9316,167.8975,282.9316,179.8975,270.9316,191.8975,121.7603,191.8975,109.7603,179.8975,121.7603,167.8975" style="stroke:#175CD3;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="18.9546" x="200.3459" y="204.5034">Yes</text><text fill="#101828" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="149.1714" x="121.7603" y="184.9919">More prioritised requirements?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="14.0615" x="95.6987" y="177.4805">No</text><rect fill="#F7F9FC" height="52.7773" rx="12.5" ry="12.5" style="stroke:#344054;stroke-width:0.5;" width="186.7461" x="102.9729" y="831.8962"/><text fill="#101828" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.7461" x="112.9729" y="855.6482">Evaluate objectives, limitations,</text><text fill="#101828" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.0996" x="112.9729" y="872.0369">and implementation evidence</text><rect fill="#F7F9FC" heig