h:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="192.5967" x="161.9478" y="297.7693">Weekly request and valid cache exists?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="18.9546" x="130.9932" y="290.2578">Yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="14.0615" x="366.5444" y="290.2578">No</text><rect fill="#F1F1F1" height="36.3887" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="223.4141" x="16" y="314.6748"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="203.4141" x="26" y="338.4268">Read DashboardSummary from Redis</text><rect fill="#F1F1F1" height="52.7773" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="224.0762" x="276.7471" y="314.6748"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="204.0762" x="286.7471" y="338.4268">Retrieve user profile, workouts, meals,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.1055" x="286.7471" y="354.8154">body records, goals, and milestones</text><rect fill="#F1F1F1" height="69.166" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="184.7422" x="296.4141" y="387.4521"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.7422" x="306.4141" y="411.2041">Calculate workout consistency,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136.7344" x="306.4141" y="427.5928">volume, progressive load,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.418" x="306.4141" y="443.9814">and muscle-group distribution</text><rect fill="#F1F1F1" height="69.166" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.